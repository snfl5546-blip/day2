  td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

from fastapi import FastAPI, HTTPException
from fastapi.middleware.cors import CORSMiddleware
from pydantic import BaseModel
from dotenv import load_dotenv
from supabase import create_client

load_dotenv()

# 로컬에선 .env를 읽고, Railway에선 Variables가 이미 들어 있음
SUPABASE_URL = os.environ["SUPABASE_URL"]
SUPABASE_SECRET_KEY = os.environ["SUPABASE_SECRET_KEY"]
FRONT_ORIGINS = [
    o.strip() for o in os.getenv("FRONT_ORIGINS", "").split(",") if o.strip()
]

sb = create_client(SUPABASE_URL, SUPABASE_SECRET_KEY)

app = FastAPI(title="my-api")

app.add_middleware(
    CORSMiddleware,
    allow_origins=FRONT_ORIGINS,
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)


@app.get("/health")
def health():
    return {"status": "ok"}


class NoteIn(BaseModel):
    content: str


@app.get("/health/db")
def health_db():
    try:
        sb.table("notes").select("id").limit(1).execute()
        return {"status": "ok", "db": "connected"}
    except Exception as e:
        raise HTTPException(status_code=500, detail=f"DB error: {e}")


@app.get("/notes")
def list_notes():
    res = sb.table("notes").select("*").order("id", desc=True).limit(50).execute()
    return res.data


@app.post("/notes", status_code=201)
def create_note(note: NoteIn):
    content = note.content.strip()
    if not content:
        raise HTTPException(status_code=400, detail="content is empty")
    res = sb.table("notes").insert({"content": content}).execute()
    return res.data[0]`;

/* ===== 화면 구성 ===== */
const $=id=>document.getElementById(id);
let si=0, cur=0, timer=null;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

$("code").innerHTML = MAIN_PY.split("\n").map((t,i)=>`<span class="ln" data-l="${i+1}"><i>${i+1}</i>${esc(t)||" "}</span>`).join("");
SCENES.forEach((s,i)=>{const b=document.createElement("button");b.className="tab";b.textContent=s.tab;b.onclick=()=>pick(i);$("tabs").appendChild(b)});

function pick(i){
  stop(); si=i; cur=0; const s=SCENES[i];
  [...$("tabs").children].forEach((b,k)=>b.classList.toggle("sel",k===i));
  $("intro").innerHTML=s.intro; $("tip").innerHTML=s.tip;
  $("code").style.display=s.code?"":"none";
  $("grid").className="grid"+(s.code?"":" nocode");
  $("chain").innerHTML=s.nodes.map((n,k)=>`<span class="chip" data-n="${k}">${n}</span>`+(k<s.nodes.length-1?'<span class="arrow">➜</span>':"")).join("");
  show(0);
}
function show(k){
  const s=SCENES[si]; cur=Math.max(0,Math.min(s.steps.length-1,k)); const st=s.steps[cur];
  document.querySelectorAll(".chip").forEach(c=>{const n=+c.dataset.n;c.classList.toggle("on",n===st.n);c.classList.toggle("done",n<st.n)});
  const lines=document.querySelectorAll(".ln"); let first=null;
  lines.forEach(el=>{const l=+el.dataset.l;const on=st.l&&st.l.length&&l>=st.l[0]&&l<=st.l[st.l.length-1];el.classList.toggle("hl",!!on);if(on&&!first)first=el});
  if(s.code&&first){const box=$("code");box.scrollTo({top:Math.max(0,first.offsetTop-90),behavior:"smooth"})}
  $("cap").innerHTML=`<h3>${st.t}</h3><p>${st.d}</p>`;
  $("data").innerHTML=`<b>🔎 이때 실제로는 이런 모습</b>${esc(st.c)}`;
  $("bar").style.width=((cur+1)/s.steps.length*100)+"%";
}
function stop(){clearInterval(timer);timer=null;$("play").textContent="▶ 자동 재생"}
$("play").onclick=()=>{
  if(timer){stop();return}
  $("play").textContent="⏸ 멈춤";
  if(cur>=SCENES[si].steps.length-1)show(0);
  timer=setInterval(()=>{ if(cur>=SCENES[si].steps.length-1){stop();return} show(cur+1) },4200);
};
$("next").onclick=()=>{stop();show(cur+1)};
$("prev").onclick=()=>{stop();show(cur-1)};
$("reset").onclick=()=>{stop();show(0)};
pick(0);
</script>
