<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full-stack 연결 테스트</title>
<style>
  body{font-family:"Malgun Gothic",sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#222}
  .row{display:flex;gap:8px;margin:12px 0}
  input{flex:1;padding:10px;border:1px solid #bbb;border-radius:6px}
  button{padding:10px 16px;border:0;border-radius:6px;background:#0e7c9b;color:#fff;cursor:pointer}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85rem;background:#eee}
  .ok{background:#d4f4dd;color:#146c2e}.fail{background:#fde0e0;color:#a11}
  li{padding:8px 0;border-bottom:1px solid #eee}
  small{color:#888}
</style>
</head>
<body>
<h1>Full-stack 연결 테스트</h1>
<p>API: <span class="badge" id="api">확인 중…</span> &nbsp; DB: <span class="badge" id="db">확인 중…</span></p>
<div class="row">
  <input id="text" placeholder="메모를 입력하세요" />
  <button id="add">저장</button>
</div>
<ul id="list"></ul>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const badge = (el, ok, msg) => { el.textContent = msg; el.className = "badge " + (ok ? "ok" : "fail"); };

async function check() {
  try { const r = await fetch(API_URL + "/health"); badge($("api"), r.ok, r.ok ? "정상" : "오류"); }
  catch { badge($("api"), false, "연결 실패"); }
  try { const r = await fetch(API_URL + "/health/db"); badge($("db"), r.ok, r.ok ? "Supabase 연결됨" : "오류(테이블 확인)"); }
  catch { badge($("db"), false, "연결 실패"); }
}
async function load() {
  try {
    const r = await fetch(API_URL + "/notes");
    const rows = await r.json();
    $("list").innerHTML = "";
    (Array.isArray(rows) ? rows : []).forEach(n => {
      const li = document.createElement("li");
      li.textContent = n.content + " ";
      const s = document.createElement("small");
      s.textContent = new Date(n.created_at).toLocaleString("ko-KR");
      li.appendChild(s); $("list").appendChild(li);
    });
  } catch {}
}
$("add").onclick = async () => {
  const content = $("text").value.trim();
  if (!content) return;
  await fetch(API_URL + "/notes", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({content})});
  $("text").value = ""; load();
};
check(); load();
</script>
</body>
</html>
